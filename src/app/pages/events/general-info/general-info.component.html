@if (!isEdit) {
  <div class="block mb-8">
    <p class="text-lg font-bold">General Info</p>
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-5">
      <div class="grid grid-cols-1 gap-5">
        <div class="flex flex-col px-5 rounded-lg py-3 dynamic-border" #shortDesc>
          <p class="text-xs text-[indigo] font-bold mb-1">Short Description</p>
          <p-scrollPanel [style]="{ width: '100%', height: '70px' }" styleClass="custom-scrollpanel small">
            <p [innerHTML]="general?.description" class="text-lg leading-[normal] mb-0 break-words"></p>
          </p-scrollPanel>
        </div>
        <div class="flex flex-col px-5">
          <p class="text-xs text-[indigo] font-bold mb-1">Location</p>
          <p [innerHTML]="general?.location" class="text-lg leading-[normal] mb-0 break-words"></p>
        </div>
      </div>
      <div class="flex flex-col px-5 rounded-lg dynamic-border" #information>
        <p class="text-xs text-[indigo] font-bold mb-1 !mt-3">Information</p>
        <p-scrollPanel [style]="{ width: '100%', height: '139px' }" styleClass="custom-scrollpanel small">
          <span [innerHTML]="general?.information" class="custom-18 leading-[normal] mb-0 break-words"></span>
        </p-scrollPanel>
      </div>
    </div>
  </div>
  <div class="block mb-8">
    <p class="text-lg font-bold">Media</p>
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-5">
      <div class="flex flex-col px-5">
        <p class="text-xs text-[indigo] font-bold mb-0">Event Logo</p>
        <p [innerHTML]="media?.eventLogoName" class="text-lg leading-[normal] mb-0 break-words"></p>
      </div>
      <div class="flex flex-col px-5">
        <p class="text-xs text-[indigo] font-bold mb-0">Background Image</p>
        <p [innerHTML]="media?.backgroundImageName" class="text-lg leading-[normal] mb-0 break-words"></p>
      </div>
    </div>
  </div>

  <div class="flex justify-end">
    <button pButton pRipple type="button" label="Edit" rounded="true" class="primary" (click)="isEdit = true"></button>
  </div>
} @else {
  <!-- MARK: Forms General Info -->
  <form [formGroup]="forms" (ngSubmit)="onSubmitted()">
    <p class="text-lg font-bold !mb-2">General Info</p>
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-3 lg:gap-8 mb-4">
      <div class="flex flex-col justify-between h-full">
        <div class="form-group !mb-3">
          <p-floatLabel>
            <textarea
                id="shortdesc"
                rows="4" cols="30"
                formControlName="description"
                pInputTextarea
                [ngClass]="{ 'is-invalid': showErrorFormControl('description') }"
                class="resize-y min-h-24"
              ></textarea>
            <label for="shortdesc">Short Description</label>
          </p-floatLabel>
          <alert-error-input
            [control]="getFormControl('description')"
            [label]="'Short Description'"
          ></alert-error-input>
        </div>
        <div class="form-group !mb-0">
          <p-floatLabel>
            <textarea
                id="location"
                rows="3" cols="30"
                formControlName="location"
                pInputTextarea
                [ngClass]="{ 'is-invalid': showErrorFormControl('location') }"
                class="resize-y min-h-16"
              ></textarea>
            <label for="location">Location</label>
          </p-floatLabel>
          <alert-error-input
            [control]="getFormControl('location')"
            [label]="'Location'"
          ></alert-error-input>
        </div>
      </div>
      <div class="form-group flex flex-col min-h-full">
        <p-editor
          formControlName="information"
          placeholder="Information"
          [style]="{ flexGrow: '1' }"
          class="bottom-toolbar p-float-label flex-grow"
          [class.filled]="!!getFormControl('information').value && getFormControl('information').value !== '\<p>\</p>'"
          [class.is-invalid]="lengthEditor > 999"
          (onInit)="onEditorInit($event)"
          (keyup)="count()"
        >
          <ng-template pTemplate="header">
            <span class="ql-formats">
              <button type="button" class="ql-bold" aria-label="Bold"></button>
              <button
                type="button"
                class="ql-italic"
                aria-label="Italic"
              ></button>
              <button
                type="button"
                class="ql-underline"
                aria-label="Underline"
              ></button>
              <button class="ql-list" value="ordered"></button>
              <button class="ql-list" value="bullet"></button>
              <button class="ql-script" value="sub"></button>
            </span>
          </ng-template>
        </p-editor>
        <div>
          <small class="text-red-500" *ngIf="lengthEditor > 999">
            Information cannot be more than 999 characters long.
          </small>
        </div>
      </div>
    </div>
    <p class="text-lg font-bold !mb-2">Media</p>
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
      <div class="grid grid-cols-1 content-start">
        <div class="form-group !mb-3">
          <p-floatLabel>
            <input pInputText formControlName="logoName" readonly="true" class="disabled:!bg-transparent" />
            <label for="logoName">Event Logo</label>
          </p-floatLabel>
        </div>
        <file-upload
          (onValueChange)="onAddFile($event, 'logo')"
          [accept_file]="'.jpg,.jpeg,.png'"
          [allowedImageTypes]="['image/jpg', 'image/jpeg', 'image/png']"
          [type_file]="'image'"
          [maxSizeImage]="25"
          [showImage]="true"
          [message]="'Maximum size 25 MB with aspect ratio 1:1 (square). Supports JPEG or PNG only.'"
          [mediaList]="logoTemp"
        ></file-upload>
      </div>
      <div class="grid grid-cols-1 content-start">
        <div class="form-group !mb-3">
          <p-floatLabel>
            <input pInputText formControlName="backgroundName" readonly="true" class="disabled:!bg-transparent" />
            <label for="backgroundName">Background Image</label>
          </p-floatLabel>
        </div>
        <file-upload
          (onValueChange)="onAddFile($event, 'background')"
          [accept_file]="'.jpg,.jpeg,.png'"
          [allowedImageTypes]="['image/jpg', 'image/jpeg', 'image/png']"
          [type_file]="'image'"
          [maxSizeImage]="25"
          [showImage]="true"
          [message]="'Maximum size 25 MB. Supports JPEG or PNG only.'"
          [isCrop]="false"
          [mediaList]="bgTemp"
        ></file-upload>
      </div>
    </div>
    <div class="flex justify-between lg:justify-end gap-8 mt-5">
      <button pButton pRipple label="Cancel" type="button" rounded="true" outlined="true" class="primary" (click)="onCancel()"></button>
      <button pButton pRipple label="Save" type="submit" rounded="true" class="primary"></button>
      <!-- [disabled]="isLoading || forms.invalid" -->
    </div>
  </form>
}
