<form [formGroup]="forms" (ngSubmit)="onSubmit()">
  <div class="p-4 lg:p-10">
    <div class="mb-10 flex items-center">
      <p class="text-xl lg:text-[28px] mb-0 font-bold">{{ titlePopup() }}</p>
      <div class="ml-auto">
        <i class="cursor-pointer pi pi-times font-bold text-lg lg:text-2xl" (click)="onClose()"></i>
      </div>
    </div>

    <div class="mb-10">
      <div class="form-group">
        <p-floatLabel>
          <input pInputText formControlName="name" />
          <label for="name">Event name *</label>
        </p-floatLabel>
        <alert-error-input [label]="'Group Chat Name'"></alert-error-input>
      </div>

      <div class="form-group">
          <ng-select
            [items]="listAssign"
            [multiple]="true"
            [closeOnSelect]="false"
            [searchable]="true"
            [hideSelected]="true"
            bindLabel="name"
            bindValue="id"
            placeholder="Assign to"
            class="custom-multiselect p-float-label"
            [maxSelectedItems]="5"
            formControlName="users"
            (ngModelChange)="resetErr()"
          >
            <ng-template ng-multi-label-tmp let-items="items" let-clear="clear">
              @for (item of items; track item) {
                <div class="ng-value" [ngClass]="{ 'is-danger': listErrAsign.includes(item.id) }">
                  <!--  [ngClass]="{ 'text-red-400': listErrAsign.includes(item.id) }" -->
                  <span class="ng-value-label">{{ rename(item?.name) }}</span>
                  <span class="ng-value-icon right" (click)="clear(item)" aria-hidden="true">×</span>
                </div>
              }
            </ng-template>
          </ng-select>
      </div>

      <div class="form-group">
        <p-floatLabel>
          <p-calendar
            inputId="startdate"
            dateFormat="yy/mm/dd"
            formControlName="startedAt"
            [showIcon]="true"
            [showClear]="true"
            [iconDisplay]="'input'"
            [maxDate]="getFormControl('endedAt').value ?? ''"
            [minDate]="startedAt ?? today"
            [ngClass]="{ 'is-invalid': isError }"
            (onFocus)="resetErr()"
          ></p-calendar>
          <label for="startdate">Start date (yyyy/mm/dd) *</label>
        </p-floatLabel>
      </div>

      <div class="form-group">
        <p-floatLabel>
          <p-calendar
            inputId="enddate"
            dateFormat="yy/mm/dd"
            formControlName="endedAt"
            [showIcon]="true"
            [showClear]="true"
            [iconDisplay]="'input'"
            [minDate]="getFormControl('startedAt').value ?? today"
            [ngClass]="{ 'is-invalid': isError }"
            (onFocus)="resetErr()"
          ></p-calendar>
          <label for="accountIds">End date (yyyy/mm/dd) *</label>
        </p-floatLabel>
      </div>
    </div>

    <div class="flex justify-content-end gap-2">
      <button
        pButton
        pRipple
        label="Save"
        type="submit"
        class="shadow-none mt-auto ml-auto !px-12 cursor-pointer bg-[indigo] hover:bg-blue-700 text-white rounded-full"
      ></button>
      <!-- [disabled]="forms.invalid || isLoading" -->
    </div>
  </div>
</form>
