<p-scrollPanel [style]="{ width: '100%', height: '460px' }" styleClass="custom-scrollpanel">
  <div class="grid lg:grid-cols-3 gap-4">
    <div class="flex flex-col justify-center items-center bg-[#F9F9F9] rounded-xl py-6 px-8 cursor-pointer !min-h-[150px]" (click)="addNew()">
      <i class="pi pi-plus !text-[indigo] text-2xl font-bold mb-5"></i>
      <h6 class="text-lg !text-[indigo]">Add a new form</h6>
    </div>

    @if (list?.length > 0) {
      @for (item of list; track $index) {
        <div class="panel !h-[150px]">
          <div class="flex flex-col justify-between h-full">
            <div class="py-0">
              <div class="!line-clamp-2 !font-bold leading-normal mb-2 text-lg">{{ item.title }}</div>
            </div>

            <div class="flex justify-between items-center mt-auto">
              <div>
                <button class="bg-transparent cursor-pointer" [routerLink]="'form/'+item.id">
                  <img src="assets/icon/icon-edit.svg" alt="">
                </button>
                <button class="bg-transparent cursor-pointer" (click)="onDelete(item)">
                  <img src="assets/icon/icon-delete.svg" alt="">
                </button>
              </div>
              <p-inputSwitch [(ngModel)]="item.status" (onChange)="onStatusChange(item)" />
            </div>
          </div>
        </div>
      }
    }
  </div>
</p-scrollPanel>
