<div class="p-4 lg:p-10 flex items-center">
  <p class="text-xl lg:text-[28px] font-bold mb-0">{{ titlePopup() }}</p>
  <div class="ms-auto">
    <i class="cursor-pointer pi pi-times font-bold text-lg lg:text-2xl" (click)="onClose()"></i>
  </div>
</div>
<div class="p-4 lg:p-10 pt-0 overflow-y-auto max-h-[570px]">
  <form [formGroup]="forms" (ngSubmit)="onSubmit()">
    <div class="mb-10">
      <!-- <p-scrollPanel [style]="{ width: '100%', height: '50vw' }"> -->
        <div class="form-group">
          <ng-select
            [items]="listAssign"
            [multiple]="true"
            [closeOnSelect]="false"
            [searchable]="true"
            [hideSelected]="true"
            bindLabel="name"
            bindValue="id"
            placeholder="Assign to"
            class="custom-multiselect p-float-label"
            [maxSelectedItems]="3"
            formControlName="users"
            (ngModelChange)="resetErr()"
          >
          <ng-template ng-multi-label-tmp let-items="items" let-clear="clear">
            @for (item of items; track item.id) {
              <div class="ng-value" [ngClass]="{ 'is-danger': listErrAsign.includes(item.id) }">
                <span class="ng-value-label">{{ rename(item?.name) }}</span>
                <span class="ng-value-icon right" (click)="clear(item)" aria-hidden="true">×</span>
              </div>
            }
          </ng-template>
          </ng-select>
        </div>

        <div class="form-group">
          <p-floatLabel>
            <input
              pInputText
              formControlName="name"
              maxlength="100"
              [ngClass]="{ 'is-invalid': showErrorFormControl('name') }"
              />
            <label for="name">Booth name *</label>
          </p-floatLabel>
          <alert-error-input
            [control]="getFormControl('name')"
            [label]="'Booth Name'"
          ></alert-error-input>
        </div>

        <div class="form-group">
          <p-floatLabel>
            <p-calendar
              inputId="startdate"
              dateFormat="yy/mm/dd"
              formControlName="startedAt"
              [showIcon]="true"
              [showClear]="true"
              [iconDisplay]="'input'"
              [maxDate]="getFormControl('endedAt').value ?? ''"
              [ngClass]="{ 'is-invalid': showErrorFormControl('startedAt') || isOutDatedStart || isErrorAssign }"
              [minDate]="startedAt ?? (mode !== 'edit' ? today : null)"
              [maxDate]="endedAt ?? null"
              (onSelect)="onSelectDate($event, 'startedAt')"
              (onFocus)="resetErr()"
              appendTo="body"
            ></p-calendar>
            <label for="startdate">Start date (yyyy/mm/dd) *</label>
          </p-floatLabel>
          <alert-error-input
            [control]="getFormControl('startedAt')"
            [label]="'Start date'"
          ></alert-error-input>
          <div><small class="text-red-500" *ngIf="isOutDatedStart">Start date is out of range</small></div>
        </div>

        <div class="form-group">
          <p-floatLabel>
            <p-calendar
              inputId="enddate"
              dateFormat="yy/mm/dd"
              formControlName="endedAt"
              [showIcon]="true"
              [showClear]="true"
              [iconDisplay]="'input'"
              [minDate]="getFormControl('startedAt').value ?? today"
              [maxDate]="endedAt ?? null"
              (onFocus)="resetErr()"
              [ngClass]="{ 'is-invalid': showErrorFormControl('endedAt') || isOutDatedEnd || isErrorAssign }"
              appendTo="body"
            ></p-calendar>
            <label for="enddate">End date (yyyy/mm/dd) *</label>
          </p-floatLabel>
          <alert-error-input
            [control]="getFormControl('endedAt')"
            [label]="'End date'"
          ></alert-error-input>
          <div><small class="text-red-500" *ngIf="isOutDatedEnd">End date is out of range</small></div>
        </div>

        <div class="form-group">
          <p-editor
            formControlName="description"
            placeholder="Information"
            [style]="{ height: '200px' }"
            class="bottom-toolbar p-float-label"
            [class.filled]="!!getFormControl('description').value && getFormControl('description').value !== '\<p>\</p>'"
            [class.is-invalid]="lengthEditor > 255"
            [ngClass]="{ 'is-invalid': showErrorFormControl('description') }"
            (onInit)="onEditorInit($event)"
            (keyup)="onTextChange($event)"
          >
            <ng-template pTemplate="header">
              <span class="ql-formats">
                <button type="button" class="ql-bold" aria-label="Bold"></button>
                <button
                  type="button"
                  class="ql-italic"
                  aria-label="Italic"
                ></button>
                <button
                  type="button"
                  class="ql-underline"
                  aria-label="Underline"
                ></button>
                <button class="ql-list" value="ordered"></button>
                <button class="ql-list" value="bullet"></button>
                <button class="ql-script" value="sub"></button>
              </span>
            </ng-template>
          </p-editor>
          <div>
            <small class="text-red-500" *ngIf="lengthEditor > 255">
              Information cannot be more than 255 characters long.
            </small>
          </div>
        </div>
      <!-- </p-scrollPanel> -->
    </div>

    <div class="flex justify-content-end gap-2 mb-10">
      <button
        pButton
        pRipple
        label="Save"
        type="submit"
        class="shadow-none mt-auto ml-auto !px-12 cursor-pointer bg-[indigo] hover:bg-blue-700 text-white rounded-full"
      ></button>
      <!-- [disabled]="forms.invalid || isLoading" -->
    </div>
  </form>
</div>
